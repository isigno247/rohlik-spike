name: Prazdroj keyword tracker
on:
  schedule:
    - cron: '5 8 * * *'     # full run, daily 09:05 Prague (winter time; 10:05 in summer)
    - cron: '7 12 * * *'    # key terms, ~13:07 Prague
    - cron: '7 16 * * *'    # key terms, ~17:07 Prague
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = all keywords, key = 22 key terms only, dash = rebuild dashboard feed only'
        default: 'key'
        type: choice
        options: [key, full, dash]
permissions:
  contents: write
  issues: write
concurrency: prazdroj-tracker
jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '5 8 * * *' && 'full' || 'key') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Measure
        if: env.MODE != 'dash'
        run: node prazdroj_tracker.mjs
      - name: Dashboard feed
        if: env.MODE == 'full' || env.MODE == 'dash'
        run: node prazdroj_dash.mjs
      - name: Save history to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history
          git commit -m "Prazdroj tracker ${MODE} run ${{ github.run_number }}" || echo "nothing to commit"
          git pull --rebase --autostash || true
          git push
      - name: Post data parts as issues (GitHub e-mails them)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in $(ls out/part_*.csv 2>/dev/null); do
            title="[rohlik-tracker] prazdroj $(head -1 "$f" | sed 's/^# prazdroj //')"
            gh issue create --repo "${{ github.repository }}" --title "$title" --body-file "$f"
            sleep 20   # space out e-mails so GitHub/Outlook don't throttle a burst
          done
      - name: Report failure by issue too
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "[rohlik-tracker] prazdroj FAILED run ${{ github.run_number }}" \
            --body "The Prazdroj tracker run failed. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
