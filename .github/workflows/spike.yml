name: Rohlik spike
on:
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node spike.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rohlik-spike-result
          path: result.json
      - name: Post results as an issue (GitHub emails it to you)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Automated Rohlik keyword measurement (Chrášťany, warehouse 8791). Run #${{ github.run_number }}."
            echo
            echo '```json'
            jq -c . result.json | head -c 60000
            echo
            echo '```'
          } > body.md
          gh issue create --repo "${{ github.repository }}" \
            --title "[rohlik-tracker] results ${{ github.run_number }}" \
            --body-file body.md
