name: Rohlik spike
on:
  workflow_dispatch: {}
jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node spike.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rohlik-spike-result
          path: result.json
